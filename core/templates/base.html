<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkillHer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #F7F8FA;
            --text-primary: #1E2A3A;
            --text-secondary: #5A6472;
            --accent: #2D8C8C;
            --accent-hover: #257373;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --info: #3B82F6;
            --glass-bg: rgba(255,255,255,0.15);
            --glass-border: rgba(255,255,255,0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0,0,0,0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 12px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 12px;
        }

        .button-primary {
            background: rgba(45,140,140,0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button-primary:hover {
            background: rgba(45,140,140,0.5);
        }

        .button-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button-secondary:hover {
            background: rgba(45,140,140,0.05);
        }

        .input-field,
        .input,
        .select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus,
        .input:focus,
        .select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(45,140,140,0.2);
        }

        .label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }

        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }

        .space-x-4 > * + * { margin-left: 1rem; }
        .space-y-4 > * + * { margin-top: 1rem; }

        .grid { display: grid; gap: 1.5rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        @media (min-width: 768px) {
            .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        .message {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .message-success { border-color: var(--success); color: var(--success); }
        .message-error { border-color: var(--error); color: var(--error); }
        .message-warning { border-color: var(--warning); color: var(--warning); }
        .message-info { border-color: var(--info); color: var(--info); }
        .message { /* default */ }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="glass">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center">
                <span class="font-bold text-xl text-[var(--text-primary)]">SkillHer</span>
            </div>
            <div class="hidden md:flex md:items-center md:space-x-6">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Dashboard</a>
                    <a href="{% url 'assessment' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Skill Assessment</a>
                    <a href="{% url 'recommendations' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Recommendations</a>
                    <a href="{% url 'profile' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Profile</a>
                    <a href="{% url 'logout' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Login</a>
                    <a href="{% url 'register' %}" class="text-[var(--text-primary)] hover:text-[var(--text-secondary)] transition-colors">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% if messages %}
      {% for message in messages %}
        <div class="message message-{{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
