{% extends "base.html" %}

{% block title %}Login - SkillHer{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6 mt-10">
    <div class="card p-6">
        <h2 class="text-2xl font-bold mb-6 text-center text-[var(--text-primary)]">Login to SkillHer</h2>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_username" class="block mb-2 font-medium text-[var(--text-primary)]">Username</label>
                <div class="relative">
                    <input type="text" name="username" id="id_username" class="input-field w-full px-4 py-2 border border-[var(--border)] rounded focus:outline-none focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent)]/20" value="" placeholder="Username">
                </div>
            </div>
            <div class="mb-6">
                <label for="id_password" class="block mb-2 font-medium text-[var(--text-primary)]">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="id_password" class="input-field w-full px-4 py-2 border border-[var(--border)] rounded focus:outline-none focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent)]/20" value="" placeholder="Password">
                </div>
            </div>
            <button type="submit" class="button-primary w-full py-2">
                Login
            </button>
        </form>
        <p class="mt-6 text-center text-[var(--text-secondary)]">
            Don't have an account? <a href="{% url 'register' %}" class="font-medium text-[var(--accent)] hover:text-[var(--accent-hover)]">Register</a>
        </p>
    </div>
</div>
{% endblock %}
