<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - SkillHer</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
:root {
            --bg-color: #FFF8F3;
            --text-primary: #1A1A2E;
            --text-secondary: #5A6472;
            --accent: #FF6B5C;
            --accent-hover: #FF523F;
            --gradient-start: #FF6B5C;
            --gradient-end: #7B4FE0;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --info: #3B82F6;
            --font-heading: 'Caveat', cursive;
        }

        h1 {
            font-family: var(--font-heading);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* Subtle background pattern */
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,107,92,0.1) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(123,79,224,0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 80%, rgba(255,107,92,0.05) 0%, transparent 15%),
                radial-gradient(circle at 60% 20%, rgba(123,79,224,0.05) 0%, transparent 15%);
            background-attachment: fixed;
            background-size: cover;
        }

        .container {
            background-color: white;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.15);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-code {
            font-size: 4rem;
            font-weight: 800;
            /* Use gradient for the number */
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            transition: transform 0.2s ease;
            border: none;
            cursor: pointer;
        }

        a:hover {
            transform: scale(1.05);
        }
</style>
</head>
<body>
    <div class="container">
        <div class="status-code">500</div>
        <h1>Server Error</h1>
        <p>Something went wrong on our end. Please try again later.</p>
        <a href="/">Go Home</a>
        <button id="theme-toggle" class="button-primary mt-4" aria-label="Toggle dark mode">🌙</button>
    </div>
    <script>
        // dark mode toggle script
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function setCookie(name, value, days = 365) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days*24*60*60*1000));
                expires = "; expires="+date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle');
        const currentTheme = getCookie('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (currentTheme === 'dark') {
            html.setAttribute('data-theme', 'dark');
            btn.innerHTML = '☀️';
        } else {
            html.removeAttribute('data-theme');
            btn.innerHTML = '🌙';
        }

        btn.addEventListener('click', () => {
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerHTML = '🌙';
                setCookie('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerHTML = '☀️';
                setCookie('theme', 'dark');
            }
        });
    </script>
</body>
</html>
