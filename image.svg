<svg width="100%" viewBox="0 0 680 982" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SkillHer platform architecture</title>
<desc>Vertical flow diagram showing the SkillHer client-server architecture: browser client, React frontend, Django REST API with JWT authentication, core platform modules, Groq AI recommendation engine, database, and analytics dashboard.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
.box-green rect{fill:#E1F5EE;stroke:#0F6E56}
.box-green text.th{fill:#04342C}
.box-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.box-gray text.th{fill:#2C2C2A} .box-gray text.ts{fill:#444441}
.box-purple rect{fill:#EEEDFE;stroke:#534AB7}
.box-purple text.th{fill:#26215C} .box-purple text.ts{fill:#3C3489}
.box-coral rect{fill:#FAECE7;stroke:#993C1D}
.box-coral text.th{fill:#4A1B0C} .box-coral text.ts{fill:#712B13}
.box-amber rect{fill:#FAEEDA;stroke:#854F0B}
.box-amber text.th{fill:#412402}
.box-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.box-teal text.th{fill:#04342C} .box-teal text.ts{fill:#085041}
.box-red rect{fill:#FCEBEB;stroke:#A32D2D}
.box-red text.th{fill:#501313} .box-red text.ts{fill:#791F1F}
text.th{font:500 14px sans-serif}
text.ts{font:400 12px sans-serif}
line{stroke:#888780;stroke-width:1.5}
</style>

<!-- User / browser client -->
<g class="box-green">
<rect x="130" y="40" width="420" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">User / browser client</text>
</g>
<line x1="340" y1="96" x2="340" y2="136" marker-end="url(#arrow)"/>

<!-- React frontend -->
<g class="box-gray">
<rect x="130" y="136" width="420" height="110" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="162" text-anchor="middle" dominant-baseline="central">React frontend</text>
<text class="ts" x="175" y="192" dominant-baseline="central">TypeScript</text>
<text class="ts" x="365" y="192" dominant-baseline="central">Tailwind CSS</text>
<text class="ts" x="175" y="214" dominant-baseline="central">React Router</text>
<text class="ts" x="365" y="214" dominant-baseline="central">Axios</text>
</g>
<line x1="340" y1="246" x2="340" y2="286" marker-end="url(#arrow)"/>

<!-- Django REST API -->
<g class="box-purple">
<rect x="130" y="286" width="420" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="312" text-anchor="middle" dominant-baseline="central">Django REST API</text>
<text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">JWT authentication</text>
</g>
<line x1="340" y1="366" x2="340" y2="406" marker-end="url(#arrow)"/>

<!-- Core platform modules -->
<g class="box-coral">
<rect x="130" y="406" width="420" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="432" text-anchor="middle" dominant-baseline="central">Core platform modules</text>
<text class="ts" x="340" y="464" text-anchor="middle" dominant-baseline="central">Skill assessment</text>
<text class="ts" x="340" y="486" text-anchor="middle" dominant-baseline="central">Skill gap analysis</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">Learning roadmaps &amp; resources</text>
<text class="ts" x="340" y="530" text-anchor="middle" dominant-baseline="central">Progress tracking</text>
</g>
<line x1="340" y1="556" x2="340" y2="596" marker-end="url(#arrow)"/>

<!-- AI recommendation engine -->
<g class="box-amber">
<rect x="130" y="596" width="420" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="624" text-anchor="middle" dominant-baseline="central">AI recommendation engine (Groq API)</text>
</g>
<line x1="340" y1="652" x2="340" y2="692" marker-end="url(#arrow)"/>

<!-- Database -->
<g class="box-teal">
<rect x="130" y="692" width="420" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="718" text-anchor="middle" dominant-baseline="central">Database</text>
<text class="ts" x="340" y="748" text-anchor="middle" dominant-baseline="central">SQLite (dev) / PostgreSQL (prod)</text>
</g>
<line x1="340" y1="772" x2="340" y2="812" marker-end="url(#arrow)"/>

<!-- Analytics dashboard -->
<g class="box-red">
<rect x="130" y="812" width="420" height="130" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="838" text-anchor="middle" dominant-baseline="central">Analytics dashboard</text>
<text class="ts" x="340" y="870" text-anchor="middle" dominant-baseline="central">Performance insights</text>
<text class="ts" x="340" y="892" text-anchor="middle" dominant-baseline="central">Growth &amp; engagement trends</text>
<text class="ts" x="340" y="914" text-anchor="middle" dominant-baseline="central">Milestone tracking</text>
</g>
</svg>
